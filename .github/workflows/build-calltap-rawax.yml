name: Build CallTap AX without XCTest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode with iPhoneOS SDK 27
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(python3 - <<'PY'
          import glob, os, re, subprocess
          choices = []
          for path in glob.glob('/Applications/Xcode*.app/Contents/Developer'):
              try:
                  sdk = subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'], env=dict(os.environ, DEVELOPER_DIR=path), text=True, stderr=subprocess.DEVNULL).strip()
                  version = tuple(map(int, re.findall(r'\d+', sdk)))
                  if version[0] >= 27: choices.append((version,path))
              except subprocess.CalledProcessError: pass
          if not choices: raise SystemExit('iPhoneOS SDK 27+ not installed')
          print(max(choices)[1])
          PY
          )"
          echo "DEVELOPER_DIR=$SDK_PATH" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$SDK_PATH" xcodebuild -version
      - name: Build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cargo --version
          rustup --version
      - name: Restore compiled Rust dependencies
        id: rawax-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            build/cargo-rawax
            ~/.cargo/registry
            ~/.cargo/git
          key: rawax-${{ runner.os }}-${{ runner.arch }}-d32c8189-${{ hashFiles('RawAX/*.rs') }}
          restore-keys: rawax-${{ runner.os }}-${{ runner.arch }}-d32c8189-
      - name: Test protocol and build normal app
        run: bash Scripts/build-calltap-rawax.sh
      - name: Save compiled Rust dependencies
        if: always() && !cancelled() && steps.rawax-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            build/cargo-rawax
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rawax-cache.outputs.cache-primary-key }}
      - name: Upload CallTap AX
        uses: actions/upload-artifact@v7
        with:
          name: CallTap-AX-experimental
          path: release/CallTap-AX-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
